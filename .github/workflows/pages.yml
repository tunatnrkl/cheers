name: GitHub Pages

on:
  push:
    branches: [main, claude/charming-davinci-emhvz1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kırmızı testle yayın yok (KARARLAR.md, karar 6).
      - run: npm run typecheck
      - run: npm test
      # Statik sürümde sunucu yoktur: API uç noktaları derlemeden çıkarılır.
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_SITE_URL: https://tunatnrkl.github.io/cheers
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
